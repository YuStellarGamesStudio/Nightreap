<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Nightreap: Beneath the Last Moon. A crescent moon glows above a village beneath the endless night.">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#090f23"/>
      <stop offset=".55" stop-color="#24233b"/>
      <stop offset="1" stop-color="#825345"/>
    </linearGradient>
    <radialGradient id="moonlight">
      <stop stop-color="#e4d9c1" stop-opacity=".39"/>
      <stop offset=".46" stop-color="#a295ac" stop-opacity=".12"/>
      <stop offset="1" stop-color="#a295ac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff6db"/>
      <stop offset=".55" stop-color="#dbd2c3"/>
      <stop offset="1" stop-color="#a99cb3"/>
    </linearGradient>
    <linearGradient id="peaks" x2="0" y2="1">
      <stop stop-color="#484357"/>
      <stop offset="1" stop-color="#1a2234"/>
    </linearGradient>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#282b37"/>
      <stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop stop-color="#0d1121" stop-opacity="0"/>
      <stop offset=".21" stop-color="#0c1020" stop-opacity=".88"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fbebc0"/>
      <stop offset=".47" stop-color="#d8b477"/>
      <stop offset="1" stop-color="#9c7355"/>
    </linearGradient>
    <radialGradient id="fire">
      <stop stop-color="#ffe6a5" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#f4aa60" stop-opacity=".69"/>
      <stop offset="1" stop-color="#e98753" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#bcb0be" stop-opacity="0"/><stop offset=".52" stop-color="#aaa0b6" stop-opacity=".19"/><stop offset="1" stop-color="#c8a7ab" stop-opacity="0"/></linearGradient>
    <linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#b7a9ba" stop-opacity=".19"/><stop offset="1" stop-color="#211d35" stop-opacity=".02"/></linearGradient>
    <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#383341"/><stop offset="1" stop-color="#151a29"/></linearGradient>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#414051"/><stop offset="1" stop-color="#121a2a"/></linearGradient>
    <mask id="crescent"><rect width="1200" height="630" fill="white"/><circle cx="298" cy="125" r="71" fill="black"/></mask>
    <path id="pine" d="M0 0 16 43 8 40 23 79 11 73 30 115-30 115-11 73-23 79-8 40-16 43Z"/>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="270" cy="152" rx="274" ry="257" fill="url(#moonlight)"/>
  <g fill="#e9d6c3">
    <circle cx="48" cy="85" r="1.4" opacity=".7"/><circle cx="112" cy="182" r="1" opacity=".45"/><circle cx="169" cy="67" r="1.6" opacity=".72"/><circle cx="384" cy="48" r="1.2" opacity=".67"/><circle cx="478" cy="109" r="1.4" opacity=".53"/><circle cx="543" cy="53" r="1" opacity=".54"/><circle cx="615" cy="140" r="1.2" opacity=".6"/><circle cx="693" cy="72" r="1.5" opacity=".5"/><circle cx="810" cy="117" r="1" opacity=".45"/><circle cx="937" cy="61" r="1.4" opacity=".6"/><circle cx="1064" cy="127" r="1" opacity=".45"/><circle cx="1153" cy="77" r="1.6" opacity=".55"/>
  </g>
